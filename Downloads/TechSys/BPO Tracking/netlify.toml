[build]
  command = "npm run build"
  publish = "dist"

# Netlify Functions directory (generated by Nitro with netlify preset)
[functions]
  directory = ".netlify/functions-internal"

# SPA-style fallback: route all requests through the SSR handler
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
